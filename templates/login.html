<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureon Bank - Login</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <style>
    body { background: #050505; color: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .card { background: #0f0f11; border: 1px solid #24242a; border-radius: 8px; }
    .field {
      width: 100%;
      background: #ffffff !important;
      border: 1px solid #34343a !important;
      color: #000000 !important;
      caret-color: #000000;
      border-radius: 6px;
      padding: 12px;
    }
    .field::placeholder { color: #4b5563 !important; opacity: 1; }
    .field:focus { outline: none; border-color: #8b5cf6 !important; box-shadow: 0 0 0 1px #8b5cf6; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #000000 !important;
      box-shadow: 0 0 0 1000px #ffffff inset !important;
      caret-color: #000000;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="w-full px-8 py-6 flex justify-between items-center fixed top-0 bg-black/50 backdrop-blur z-10">
    <a class="text-xl font-bold" href="/register-page/">Aureon Bank</a>
    <a class="text-sm text-gray-400 hover:text-white" href="/register-page/">Sign Up</a>
  </header>

  <main class="flex-1 flex items-center justify-center px-6 pt-24 pb-12">
    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
      <section>
        <h1 class="text-5xl lg:text-6xl font-bold leading-tight">Secure Gateway to <br>Your Wealth</h1>
        <p class="text-gray-400 text-lg max-w-md mt-6">Login to open your account view first, then manage accounts, summaries, transfers, and transactions.</p>
      </section>

      <section class="card w-full max-w-md p-10 justify-self-center">
        <h2 class="text-2xl font-semibold">Login to Account</h2>
        <p class="text-gray-400 text-sm mt-2 mb-8">Use your registered email and password.</p>
        <form id="loginForm" class="space-y-6">
          <label class="block space-y-2">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Email</span>
            <input class="field" name="email" type="email" placeholder="you@example.com" required>
          </label>
          <label class="block space-y-2">
            <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Password</span>
            <input class="field" name="password" type="password" placeholder="Password" required>
          </label>
          <button class="w-full bg-violet-600 hover:bg-violet-700 text-white font-semibold py-3 rounded-md" type="submit">Login</button>
          <p id="loginError" class="hidden text-center text-sm text-red-400"></p>
        </form>
        <p class="text-center mt-6 text-sm text-gray-400">New to Aureon Bank? <a class="text-violet-500 font-medium hover:underline" href="/register-page/">Sign Up</a></p>
      </section>
    </div>
  </main>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.getElementById('loginError');
      const button = form.querySelector('button');
      error.classList.add('hidden');
      button.disabled = true;
      button.textContent = 'Logging in...';
      try {
        const response = await fetch('/api/users/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, password: form.password.value })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Invalid email or password.');
        localStorage.setItem('access', data.access);
        localStorage.setItem('refresh', data.refresh);
        localStorage.setItem('token', data.access);
        window.location.href = '/accounts/';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
        button.disabled = false;
        button.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
