<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aureon Bank - Sign Up</title>
<link rel="stylesheet" href="/static/css/output.css">  <style>
    body { background: #0a0a0b; color: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    .card { background: #121214; border: 1px solid #24242a; border-radius: 8px; }
    .field {
      width: 100%;
      background: #1c1c1f !important;
      border: 1px solid #34343a !important;
      color: #ffffff !important;
      caret-color: #a78bfa;
      border-radius: 6px;
      padding: 12px;
    }
    .field::placeholder { color: #71717a !important; opacity: 1; }
    .field:focus { outline: none; border-color: #8b5cf6 !important; box-shadow: 0 0 0 1px #8b5cf6; }
    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus {
      -webkit-text-fill-color: #ffffff !important;
      box-shadow: 0 0 0 1000px #1c1c1f inset !important;
      caret-color: #a78bfa;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="w-full py-6 px-8 flex justify-between items-center bg-black/50 sticky top-0 z-10">
    <a class="text-xl font-bold uppercase" href="/register-page/">Aureon Bank</a>
    <a class="text-sm text-gray-400 hover:text-white" href="/login-page/">Login</a>
  </header>

  <main class="flex-1 flex items-center justify-center p-6">
    <section class="card w-full max-w-lg p-10">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold">Create an account</h1>
        <p class="text-gray-400 text-sm mt-3">Sign up first, then login to open your account dashboard.</p>
      </div>
      <form id="registrationForm" class="space-y-6">
        <label class="block space-y-2">
          <span class="text-xs font-bold uppercase tracking-widest text-gray-500">Email</span>
          <input class="field" name="email" type="email" placeholder="you@example.com" required>
        </label>
        <label class="block space-y-2">
          <span class="text-xs font-bold uppercase tracking-widest text-gray-500">Phone Number</span>
          <input class="field" name="phone" type="tel" placeholder="10-digit number" maxlength="10" required>
        </label>
        <label class="block space-y-2">
          <span class="text-xs font-bold uppercase tracking-widest text-gray-500">Password</span>
          <input class="field" name="password" type="password" placeholder="Password" required>
        </label>
        <label class="block space-y-2">
          <span class="text-xs font-bold uppercase tracking-widest text-gray-500">Confirm Password</span>
          <input class="field" name="confirm_password" type="password" placeholder="Confirm password" required>
        </label>
        <button id="submitBtn" class="w-full bg-violet-500 hover:bg-violet-400 text-black font-bold py-3 rounded-md" type="submit">Create Account</button>
        <button class="w-full border border-gray-700 hover:bg-white/5 text-white font-semibold py-3 rounded-md" onclick="window.location.href='/login-page/'" type="button">Back to Login</button>
        <p id="error-message" class="hidden text-center text-sm text-red-400"></p>
      </form>
    </section>
  </main>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const error = document.getElementById('error-message');
      const button = document.getElementById('submitBtn');
      error.classList.add('hidden');

      if (form.password.value !== form.confirm_password.value) {
        error.textContent = 'Passwords do not match.';
        error.classList.remove('hidden');
        return;
      }

      button.disabled = true;
      button.textContent = 'Creating Account...';
      try {
        const response = await fetch('/api/users/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: form.email.value, phone: form.phone.value, password: form.password.value })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(Object.values(data).flat().join(' ') || 'Registration failed.');
        window.location.href = '/login-page/';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('hidden');
        button.disabled = false;
        button.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
