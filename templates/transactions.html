<!DOCTYPE html>

<html class="h-full bg-[#131313]" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Transaction - Aureon Bank</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for Custom Colors & Fonts -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#8B5CF6',
            'surface-dark': '#131313',
            'surface-container': '#1c1b1b',
            'surface-bright': '#3a3939',
            'input-bg': '#1e1e1e',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          borderRadius: {
            'custom': '4px',
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-scrollbars">
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #131313;
    }
    ::-webkit-scrollbar-thumb {
      background: #3a3939;
      border-radius: 10px;
    }
  </style>
<style data-purpose="layout-adjustments">
    .sidebar-active {
      background: linear-gradient(90deg, rgba(139, 92, 246, 0.1) 0%, rgba(139, 92, 246, 0) 100%);
      border-left: 2px solid #8B5CF6;
    }
  </style>
</head>
<body class="h-full text-gray-100 font-sans flex overflow-hidden">
<!-- BEGIN: Sidebar Navigation -->
<aside class="w-64 flex-shrink-0 bg-[#0e0e0e] border-r border-white/5 flex flex-col justify-between" data-purpose="main-sidebar">
<div class="flex flex-col">
<!-- Brand Logo Section -->
<div class="p-6 mb-4">
<h1 class="text-xl font-bold text-white leading-tight">Aureon Bank</h1>
<p class="text-[10px] uppercase tracking-widest text-gray-500 font-semibold">Premium Banking</p>
</div>
<!-- Navigation Links -->
<nav class="space-y-1"><a class="flex items-center px-6 py-3 text-sm text-gray-400 hover:text-white transition-colors" href="#">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          View Accounts
        </a>
<a class="flex items-center px-6 py-3 text-sm text-gray-400 hover:text-white transition-colors" href="#">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          Transfer Money
        </a>
<a class="flex items-center px-6 py-3 text-sm text-gray-400 hover:text-white transition-colors" href="#">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
          Account Summary
        </a></nav>
</div>
<!-- Bottom Actions -->
<div class="p-6">
<a class="flex items-center text-sm text-gray-400 hover:text-white transition-colors" href="#">
<svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Logout
      </a>
</div>
</aside>
<!-- END: Sidebar Navigation -->
<!-- BEGIN: Main Content Area -->
<main class="flex-1 overflow-y-auto bg-[#131313]" data-purpose="main-viewport">
<!-- Top Bar -->
<header class="px-10 py-6">
<button class="flex items-center text-sm text-gray-400 hover:text-white transition-colors group">
<svg class="w-4 h-4 mr-2 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
        Back to Account Details
      </button>
</header>
<div class="max-w-4xl px-10 pb-20">
<!-- Page Title -->
<div class="mb-10">
<h2 class="text-3xl font-semibold text-white mb-2">Add New Transaction</h2>
<p class="text-gray-500">Record a credit or debit entry for this account.</p>
</div>
<!-- BEGIN: Transaction Form Card -->
<section class="bg-[#1c1b1b] border border-white/5 rounded-lg p-8 mb-8" data-purpose="transaction-form-container">
<form class="space-y-8">
<!-- Transaction Type Toggle -->
<div data-purpose="type-selector">
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Transaction Type</label>
<div class="grid grid-cols-2 gap-0 border border-white/10 rounded-md overflow-hidden">
<button class="flex items-center justify-center py-3 bg-[#3a3939] text-white border-r border-white/10" type="button">
<svg class="w-4 h-4 mr-2 border border-white rounded-full p-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 6v6m0 0v6m0-6h6m-6 0H6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                Credit
              </button>
<button class="flex items-center justify-center py-3 text-gray-400 hover:bg-white/5 transition-colors" type="button">
<svg class="w-4 h-4 mr-2 border border-gray-400 rounded-full p-0.5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
                Debit
              </button>
</div>
</div>
<!-- Amount Input -->
<div data-purpose="amount-input">
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Amount</label>
<div class="relative group">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-2xl text-gray-600 font-medium group-focus-within:text-white">₹</span>
<input class="w-full bg-[#1e1e1e] border border-white/10 rounded-md py-5 pl-12 pr-4 text-3xl font-medium text-white focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary placeholder-gray-700" placeholder="0.00" type="text"/>
</div>
<p class="mt-3 text-xs text-gray-600">Available balance: ₹4,52,300.00</p>
</div>
<!-- Category & Date Grid -->
<div class="grid grid-cols-2 gap-6">
<div>
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Category</label>
<select class="w-full bg-[#1e1e1e] border border-white/10 rounded-md py-3 px-4 text-gray-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary appearance-none">
<option>Select Category</option>
<option>Rent</option>
<option>Utilities</option>
<option>Salary</option>
<option>Freelance</option>
</select>
</div>
<div>
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Transaction Date</label>
<input class="w-full bg-[#1e1e1e] border border-white/10 rounded-md py-3 px-4 text-gray-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary" placeholder="mm/dd/yyyy" type="text"/>
</div>
</div>
<!-- Reference Note -->
<div data-purpose="reference-input">
<label class="block text-xs font-medium text-gray-500 uppercase tracking-wider mb-3">Reference / Note</label>
<textarea class="w-full bg-[#1e1e1e] border border-white/10 rounded-md py-3 px-4 text-gray-400 focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary resize-none" placeholder="e.g. Monthly Rent Payment" rows="4"></textarea>
</div>
<!-- Action Buttons -->
<div class="flex gap-4 pt-4">
<button class="flex-1 bg-primary hover:bg-primary/90 text-black font-semibold py-3.5 rounded-md flex items-center justify-center transition-colors" type="submit">
<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              Submit Transaction
            </button>
<button class="flex-1 border border-white/10 hover:bg-white/5 text-gray-400 font-semibold py-3.5 rounded-md transition-colors" type="button">
              Cancel
            </button>
</div>
</form>
</section>
<!-- END: Transaction Form Card -->
<!-- BEGIN: Footer Info Cards -->
<!-- END: Footer Info Cards -->
</div>
</main>
<!-- END: Main Content Area -->
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const go = (url) => { window.location.href = url; };

    document.querySelectorAll('a').forEach((link) => {
      const text = link.textContent.trim().toLowerCase();
      if (text.includes('view accounts')) link.href = '/accounts/';
      if (text.includes('transfer money')) link.href = '/transfer/';
      if (text.includes('account summary')) link.href = '/summary/';
      if (text.includes('logout')) link.href = '/login-page/';
    });

    document.querySelectorAll('button').forEach((button) => {
      const text = button.textContent.trim().toLowerCase();
      if (text.includes('back to account details') || text.includes('cancel') || text.includes('submit transaction')) {
        button.addEventListener('click', (event) => {
          event.preventDefault();
          go('/account-page/');
        });
      }
    });
  });
</script>
</body></html>
